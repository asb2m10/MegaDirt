name: megadirt-pipeline

on:
  push:
    branches:
      - '*'
    tags:
      - '*'
  pull_request:
    branches: [ main ]

defaults:
  run:
    shell: bash

jobs:
  component_version:
    name: "Set up version"
    runs-on: ubuntu-latest
    outputs:
      build_version: ${{ steps.vers.outputs.build_version }}
      build_type : ${{ steps.vers.outputs.build_type }}
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Calculate version"
        id: vers
        run: |
          ref=${{ github.ref }}

          echo "## Creating version from '${ref}'" >> $GITHUB_STEP_SUMMARY

          if [ "$GITHUB_REF_TYPE" == "tag" ]; then
            echo "Generating Release Version" >> $GITHUB_STEP_SUMMARY
            export BUILD_VERSION=${GITHUB_REF_NAME:1}
            export BUILD_TYPE=Release
          else
            echo "Generating Nightly Version" >> $GITHUB_STEP_SUMMARY
            export BUILD_VERSION="NIGHTLY-$(date +%Y-%m-%d)-$(git rev-parse --short HEAD)"
            export BUILD_TYPE=DEVBUILD
          fi

          echo "build_version=${BUILD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_type=${BUILD_TYPE}" >> "$GITHUB_OUTPUT"

  build-linux:
    runs-on: ubuntu-latest
    needs: [ component_version ]

    steps:
    - uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: libasound2-dev libx11-dev libxinerama-dev libxext-dev libfreetype6-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev ccache xvfb libjack-dev libsndfile-dev

    - uses: actions/checkout@v4
      with:
         submodules: recursive

    - name: Build
      run: |
        cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{ needs.component_version.outputs.build_type }} -DCMAKE_CXX_FLAGS=-DDEXED_ID=${{ needs.component_version.outputs.build_version }} -DPROJECT_VERSION=${{ needs.component_version.outputs.build_version }}
        cmake --build ${{github.workspace}}/build --config ${{ needs.component_version.outputs.build_type }}
        cpack ${{github.workspace}}/build -G ZIP


    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: linux-bin
        path: |
          ${{github.workspace}}/build/dist/*.zip


  publish-nightly:
    name: "Publish Nightly"
    runs-on: ubuntu-latest
    needs: [ build-linux ]
    steps:
      - name: "Upload to nightly"
        uses: surge-synthesizer/sst-githubactions/upload-to-release@main
        with:
          tag: Nightly
          reuse_tag: true
          create_tag: false
          token: ${{ secrets.GITHUB_TOKEN }}

